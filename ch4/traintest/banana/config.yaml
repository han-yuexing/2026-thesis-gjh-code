# Banana模型训练配置文件

# 数据集配置
dataset:
  type: 'banana'  # 香蕉数据集
  img_dir: 'data/banana'  # 相对于项目根目录
  
# 训练超参数
training:
  epochs: 100
  batch_size: 20
  lr: 0.00005
  n_runs: 10  # 运行次数（用于显著性检验）
  
# 随机种子（需要至少10个种子）
seeds: []

# 模型配置
model:
  pretrained_path: 'model/pretrained/resnet18.pth'  # 相对于项目根目录
  feature_fusion_type: 'cross_attention'  # "cross_attention", "add", "multiply", "concat"
  fpn_ablation_type: 'ripe_only'  # "none", "both", "ripe_only", "weight_only"
  combine_type: 'lka'  # "lka", "conv", "conv3_lka1", "conv2_lka2", "conv1_lka3"

# 训练阶段配置
stage: 1  # 1: 全模型训练, 2: 仅训练level分类器

# 损失函数配置
loss:
  type: 'multi_task'  # "multi_task", "huber", "mse"
  gamma: 0.1  # loss_level的权重系数（仅在multi_task时使用）

# 数据预处理
transform:
  resize: [224, 224]
  rotation_degrees: 15

# 结果保存配置
save:
  results_dir: 'results'  # 相对于项目根目录
  create_dated_folder: true
  model_name: 'BananaModel'



